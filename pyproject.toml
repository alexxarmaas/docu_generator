[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docu-generator"
version = "0.1.0"
description = "Generate user guides from screenshots and structured prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.44",
    "openai>=1.70",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
